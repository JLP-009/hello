[project]
name = "saas-backend"
version = "0.1.0"
description = "SaaS-ready FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "slowapi>=0.1.9"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
