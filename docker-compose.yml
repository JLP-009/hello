services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    restart: unless-stopped
    env_file: .env.example
    volumes:
      - ./data:/app/data
      - ./backend/logs:/app/backend/logs
      - ./backend/storage:/app/backend/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_frontend
    restart: unless-stopped
    env_file: .env.example
    ports:
      - "3000:3000"
    depends_on:
      - backend
